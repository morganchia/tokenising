<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
    <script>
      // MetaMask's Chrome MV3 service worker can die when idle and throw
      // "Failed to connect to MetaMask" internally. Suppress it before the
      // React dev overlay (react-error-overlay) ever sees it by:
      // 1. Patching EventTarget.prototype.addEventListener so every future
      //    error/unhandledrejection listener (including CRA's) silently drops
      //    the MetaMask-internal error before doing anything.
      // 2. Setting window.onerror to return true (handled) for the same error.
      (function () {
        function isMetaMaskInternalError(msg) {
          return typeof msg === 'string' && msg.indexOf('Failed to connect to MetaMask') !== -1;
        }

        // Wrap every addEventListener so CRA's own error listener skips this error.
        var _origAEL = EventTarget.prototype.addEventListener;
        EventTarget.prototype.addEventListener = function (type, listener, options) {
          if ((type === 'error' || type === 'unhandledrejection') && this === window) {
            var _orig = listener;
            listener = function (event) {
              var msg = type === 'error'
                ? event.message
                : (event.reason && event.reason.message);
              if (isMetaMaskInternalError(msg)) {
                event.preventDefault && event.preventDefault();
                return;
              }
              return _orig.call(this, event);
            };
          }
          return _origAEL.call(this, type, listener, options);
        };

        // Also cover window.onerror for synchronous throws.
        window.onerror = function (message) {
          if (isMetaMaskInternalError(message)) return true;
        };

        // Cover unhandled promise rejections that reach window directly.
        window.onunhandledrejection = function (event) {
          if (event && event.reason && isMetaMaskInternalError(event.reason.message)) {
            event.preventDefault && event.preventDefault();
            return true;
          }
        };
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    -->
  </body>
</html>
